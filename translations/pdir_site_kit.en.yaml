    full_report: Full report

settings:
    title: Settings
    back: Back to the dashboard
    save: Save
    saved: The settings have been saved.
    site_saved: The settings for "%site%" have been saved.
    invalid_client_id: The client ID must end with .apps.googleusercontent.com.
    invalid_property: The GA4 property ID may only contain digits.
    invalid_gsc_property: 'The Search Console property must start with "sc-domain:" or "http(s)://".'
    invalid_gsc_verification: 'Please enter the file name of the Search Console verification file, e.g. google8bfe7b6619fd8ee1.html.'
    invalid_measurement_id: The measurement ID must have the format G-XXXXXXXXXX.
    invalid_container_id: The container ID must have the format GTM-XXXXXXX.
    credentials:
        title: Google Cloud access
        external: The OAuth credentials are set in the configuration (environment variables).
        step_project: Open the <a href="https://console.cloud.google.com/projectcreate" target="_blank" rel="noopener noreferrer">Google Cloud console</a> and create a project (or select an existing one).
        step_apis: Under "APIs &amp; Services", enable the <em>Google Search Console API</em>, the <em>Google Analytics Data API</em> and the <em>Google Analytics Admin API</em>, and for the automatic verification of websites the <em>Google Site Verification API</em>.
        step_consent: Set up the <a href="https://console.cloud.google.com/auth/overview" target="_blank" rel="noopener noreferrer">Google Auth Platform</a> (OAuth consent screen) and set the publishing status to "In production". In "Testing", access expires after 7 days.
        step_client: Under "Clients", create an OAuth client of type "Web application", add the redirect URI below and copy the client ID and client secret here.
        redirect_uri: Authorized redirect URI
        https_required: Google only accepts HTTPS addresses (except localhost). Open the back end via HTTPS.
        client_id: Client ID
        client_secret: Client secret
        secret_stored: Stored – enter again to change
        env_hint: Alternatively, set <code>SITEKIT_GOOGLE_CLIENT_ID</code> and <code>SITEKIT_GOOGLE_CLIENT_SECRET</code> in your <code>.env.local</code> (see README). The secret is stored encrypted.
    connection:
        title: Connect Google account
        intro: Sign in with the Google account that has access to Search Console and Analytics of your websites. Site Kit only requests read access.
        connect: Sign in with Google
        reconnect: Reconnect
        disconnect: Disconnect
        disconnect_confirm: Do you really want to disconnect from Google? The tracking code stays active.
        connected: Connected as %email%
        needs_credentials: Enter the Google Cloud access first.
    sites:
        title: Websites
        reload: Reload properties
        manual_hint: Without a Google connection you can enter the IDs manually. The tracking code works without a connection.
        gsc_property: Search Console property
        gsc_verification: Search Console verification (HTML file)
        gsc_verification_hint: 'Optional: file name of the verification file from Search Console. Site Kit serves the file, there is nothing to upload.'
        gsc_verification_active: 'The verification file is available at'
        gsc_verify: 'Verify with Google (%url%)'
        gsc_verify_hint: 'Requests the verification file from Google, has the website verified and adds it to Search Console. Unsaved changes in this form are lost.'
        gsc_verify_scopes_hint: 'Google asks once for additional permissions (verify websites and manage Search Console properties). The reports stay read-only.'
        gsc_verify_no_domain: 'Automatic verification requires a domain name in the root page.'
        ga4_property: GA4 property (reports)
        no_access: no access
        measurement_id: GA4 measurement ID (tracking)
        measurement_hint: If empty, the measurement ID of the selected property's data stream is looked up.
        gtm_container: Tag Manager container
        gtm_hint: If GA4 is already set up in the container, leave the measurement ID empty to avoid double counting.
        tracking: Output the tracking code on this website
        consent: Consent Mode v2
        consent_hint: With "denied", your cookie banner has to call gtag('consent', 'update', …) after consent was given.

verification:
    done: 'The website %url% has been verified with Google and added to Search Console.'
    failed: 'The verification with Google failed: %error%'
    missing_scopes: 'Permissions for the verification are missing. Click “Verify with Google” again and allow all requested access.'

oauth:
    no_credentials: Please enter the client ID and client secret first.
    invalid_state: The Google sign-in has expired or is invalid. Please try again.
    denied: 'Google cancelled the sign-in (%error%).'
    failed: 'Connecting to Google failed: %error%'
    missing_scopes: Not all access was allowed. Reconnect and tick all checkboxes, otherwise reports are missing.
    connected: Site Kit is now connected to %email%.
    disconnected: Google has been disconnected.
